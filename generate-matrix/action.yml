name: Generate CI matrix
description: >
  Generates a PHP * Laravel * Additional package test matrix, using min-versions from composer.json and latest releases from Packagist.
  Excludes the latest versions combination for a separate job with code coverage.

inputs:
  additional-package:
    description: Optional composer package to include as an additional matrix axis
    required: false
    default: ''
  custom-exclude:
    description: Optional JSON array of additional matrix.exclude objects
    required: false
    default: '[]'

outputs:
  matrix:
    description: JSON matrix object for strategy.matrix
    value: ${{ steps.generate-matrix.outputs.matrix }}
  php-latest:
    description: Latest PHP version major.minor (e.g. "8.5")
    value: ${{ steps.generate-matrix.outputs.php-latest }}
  laravel-latest:
    description: Latest Laravel version (e.g. "13.*")
    value: ${{ steps.generate-matrix.outputs.laravel-latest }}
  additional-package-latest:
    description: Latest version of the optional composer package (e.g. "12.*")
    value: ${{ steps.generate-matrix.outputs.additional-package-latest }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Generate matrix
      id: generate-matrix
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        ADDITIONAL_PACKAGE: ${{ inputs.additional-package }}
        CUSTOM_EXCLUDE: ${{ inputs.custom-exclude }}
      run: python ./generate-matrix.py
