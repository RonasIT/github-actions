name: Run tests

on:
  workflow_call:
    inputs:
      use-database:
        description: Enable PostgreSQL-backed test jobs
        required: false
        type: boolean
        default: false
      additional-package:
        description: Optional composer package to include as an additional matrix axis
        required: false
        type: string
        default: ''
      custom-exclude:
        description: Optional JSON array of additional matrix.exclude objects
        required: false
        type: string
        default: '[]'
      phpunit-command:
        description: Command used to run PHPUnit tests
        required: false
        type: string
        default: vendor/bin/phpunit
      phpunit-coverage-command:
        description: Command used to run PHPUnit tests with coverage
        required: false
        type: string
        default: vendor/bin/phpunit --coverage-clover build/logs/clover.xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      php-latest: ${{ steps.generate-matrix.outputs.php-latest }}
      laravel-latest: ${{ steps.generate-matrix.outputs.laravel-latest }}
      additional-package-latest: ${{ steps.generate-matrix.outputs.additional-package-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Generate matrix
        id: generate-matrix
        uses: ronasit/github-actions/generate-matrix@main
        with:
          additional-package: ${{ inputs.additional-package }}
          custom-exclude: ${{ inputs.custom-exclude }}

  tests:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    services: &postgres-service
      postgres:
        image: ${{ inputs.use-database && 'postgres' || '' }}
        env:
          POSTGRES_DB: forge
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ronasit/github-actions/php-laravel-setup@main
        with:
          php-version: ${{ matrix.php-version }}
          laravel-version: ${{ matrix.laravel-version }}
          coverage: none
          use-database: ${{ inputs.use-database && 'true' || 'false' }}
          additional-package: ${{ inputs.additional-package }}
          additional-package-version: ${{ matrix.additional-package-version }}
      - name: Execute unit tests via PHPUnit
        run: ${{ inputs.phpunit-command }}

  tests-with-coverage:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    services: *postgres-service
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup
        uses: ronasit/github-actions/php-laravel-setup@main
        with:
          php-version: ${{ needs.prepare-matrix.outputs.php-latest }}
          laravel-version: ${{ needs.prepare-matrix.outputs.laravel-latest }}
          coverage: xdebug
          use-database: ${{ inputs.use-database && 'true' || 'false' }}
          additional-package: ${{ inputs.additional-package }}
          additional-package-version: ${{ needs.prepare-matrix.outputs.additional-package-latest }}
      - name: Check code style via Pint
        run: vendor/bin/pint --test
      - name: Execute unit tests via PHPUnit with coverage
        run: ${{ inputs.phpunit-coverage-command }}
      - name: Export coverage report
        uses: actions/upload-artifact@v7
        with:
          name: clover.xml
          path: build/logs

  upload-to-coveralls:
    needs: [ tests, tests-with-coverage ]
    runs-on: ubuntu-latest
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
      - name: Checkout
        uses: actions/checkout@v6
      - name: Import coverage report
        uses: actions/download-artifact@v7
        with:
          name: clover.xml
          path: build/logs
      - name: Upload coverage results to Coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=build/logs/clover.xml -v --json_path=coveralls-upload.json
