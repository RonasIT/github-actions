name: PHP Laravel setup
description: Setup PHP and install dependencies for selected Laravel versions

inputs:
  php-version:
    description: PHP version for the job
    required: true
  laravel-version:
    description: Laravel version  for the job
    required: true
  coverage:
    description: Coverage driver passed to setup-php
    required: false
    default: none
  use-database:
    description: Enable PostgreSQL-backed test jobs
    required: false
    default: 'false'
  additional-package:
    description: Optional composer package to install for the current matrix job
    required: false
    default: ''
  additional-package-version:
    description: Optional composer package version for the job
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        coverage: ${{ inputs.coverage }}
        tools: composer

    - name: Configure database environment
      if: ${{ inputs.use-database == 'true' }}
      shell: bash
      run: |
        db_connection="${DB_CONNECTION:-pgsql}"
        db_host="${DB_HOST:-127.0.0.1}"
        db_port="${DB_PORT:-5432}"
        db_database="${DB_DATABASE:-forge}"
        db_username="${DB_USERNAME:-forge}"
        db_password="${DB_PASSWORD:-secret}"

        {
          echo "DB_CONNECTION=$db_connection"
          echo "DB_HOST=$db_host"
          echo "DB_PORT=$db_port"
          echo "DB_DATABASE=$db_database"
          echo "DB_USERNAME=$db_username"
          echo "DB_PASSWORD=$db_password"
        } >> "$GITHUB_ENV"

    - name: Specify the Laravel version
      shell: bash
      env:
        LARAVEL_VERSION: ${{ inputs.laravel-version }}
      run: composer require "laravel/framework:$LARAVEL_VERSION" -q --no-update

    - name: Specify the additional package version
      if: ${{ inputs.additional-package != '' && inputs.additional-package-version != '' }}
      shell: bash
      env:
        ADDITIONAL_PACKAGE: ${{ inputs.additional-package }}
        ADDITIONAL_PACKAGE_VERSION: ${{ inputs.additional-package-version }}
      run: composer require "$ADDITIONAL_PACKAGE:$ADDITIONAL_PACKAGE_VERSION" -q --no-update

    - name: Install composer dependencies
      shell: bash
      run: composer update -W -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
